[package]
name = "friends"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
chrono = { version = "0.4", features = ["clock"] }
async-trait = "0.1.89"
crossterm = "0.29.0"
dirs = "6.0.0"
open = "5.3.5"
ratatui = "0.30.0"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"
urlencoding = "2.1.3"
uuid = { version = "1.23.2", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
